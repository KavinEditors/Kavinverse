<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kavinverse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HERO -->
  <section id="hero" class="fade-in">
    <div class="hero-content">
      <h1 class="glow-text">Welcome to Kavinverse</h1>
      <p class="glow-sub">Innovations in Code, Creativity, and AI</p>
      <button class="cta">Explore</button>
    </div>
    <img src="https://github.com/KavinEditors/Kavinverse/raw/main/assets/image.png" class="hero-img" alt="Main Visual">
  </section>

  <!-- PROJECTS -->
  <section id="projects" class="fade-in">
    <h2 class="gradient-text">Projects</h2>
    <div class="project-row">
      <div class="project">
        <h3 class="gradient-text">R.O.A.S.T</h3>
        <p>AI-based humorous analyzer for comments.</p>
      </div>
      <div class="project">
        <h3 class="gradient-text">NEXA</h3>
        <p>Next-gen personal executive assistant.</p>
      </div>
      <div class="project">
        <h3 class="gradient-text">Connect with Me</h3>
        <p>Let’s build something remarkable.</p>
      </div>
    </div>
  </section>

  <!-- AI WIDGET -->
  <div id="ai-widget">
    <div id="ai-circle"></div>
    <div id="chat-box" class="hidden">
      <div id="chat-body"></div>
      <div class="chat-input">
        <input id="user-input" type="text" placeholder="Ask me anything..." />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
